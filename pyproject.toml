[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thunder"
version = "1.0.0"
description = "Simulation framework for reconstructing 3D lightning channels from thunder recorded by microphone arrays."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "plotly>=5.18",
    "scikit-learn>=1.3",
    "threadpoolctl>=3.1",
    "emcee>=3.1",
    "soundfile>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4", "mypy>=1.8", "types-PyYAML"]
fast = ["numba>=0.59"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = ["slow: long-running Monte Carlo tests (skipped by default; run with -m slow)"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
