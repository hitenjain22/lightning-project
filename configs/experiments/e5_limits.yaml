# E5 limits (SPEC.md Phase 7). BASE config: scripts/e5_limits.py sweeps strike distance
# (1-15 km), branching depth (0-3) and in-cloud sections, all on the same bolts, with Method B
# (best coverage in M6) assuming the true atmosphere (oracle: the physical limit) and the
# mismatched one (practical). Ambient noise is ABSOLUTE (dB SPL), so the SNR falls with
# distance as it would in the field; a louder-ambient variant bounds the uncertainty of the
# acoustic efficiency (assumption A12): +20 dB ambient = 100x less acoustic energy.
experiment: e5_limits
seed: 20261015  # distinct from E1 (20261005)
description: E5 limits, distance / branching depth / in-cloud, Method B, realistic.

channel:
  preset: branched
  strike_distance_m: [3000.0, 3000.0]

atmosphere:
  model: stratified
  temperature_c: 25.0
  lapse_rate_k_per_km: 6.5
  relative_humidity: 0.5
  wind: {speed_mps: 5.0, direction_from_deg: 270.0}
  absorption: true
  ground_reflection: true

array:
  layout: square_center
  aperture_m: 50.0

synthesis:
  write_wav: false

sensors:                       # realistic field kit (E2-E5)
  mic: {preset: measurement}
  timing: {preset: gps_synced}
  position: {preset: surveyed}
  flash_time: {preset: photodiode}
  noise:
    background_db_spl: 45.0    # VERIFY
    wind_speed_mps: 3.0

reconstruction:
  method: B

monte_carlo:
  n_bolts: 24
  presets: [branched]
  keep_points: false
  bootstrap_samples: 1000
