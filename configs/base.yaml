# Base run config. Each milestone adds its own section (channel, synthesis, atmosphere, ...).
experiment: base
seed: 0
results_root: results
sample_rate_hz: 8000.0   # recording sample rate (SPEC.md conventions)
oversample: 8            # internal oversampling factor for fractional delays
description: One bolt end to end (channel, thunder, realistic sensors, Method A) - the quick demo.

channel:
  preset: branched          # straight | tortuous | branched | with_incloud | multi_stroke

atmosphere:
  model: uniform
  temperature_c: 25.0

array:
  layout: square_center     # triangle | square | square_center | circle | l_shape | cross | mast | random_disk | distributed | free_form
  aperture_m: 50.0          # largest horizontal mic-to-mic distance
  mic_height_m: 1.5

synthesis:
  emitter_spacing_m: 0.5
  write_wav: true

sensors:
  mic: {preset: measurement}          # ideal | measurement | audio | phone
  timing: {preset: gps_synced}        # perfect | shared_interface | gps_synced | hand_synced
  position: {preset: surveyed}        # exact | surveyed | tape | consumer_gps
  flash_time: {preset: photodiode}    # exact | photodiode | lightning_network | video_30fps
  noise:
    background_db_spl: 45.0           # ambient level in the 10-300 Hz band (VERIFY; E2-E7 field kit)
    background_color: pink
    wind_speed_mps: 3.0

reconstruction:
  method: A                           # A plane-wave TDOA | B SRP-PHAT | C multilateration | D Bayesian
  # atmosphere: {...}                 # omit = assume the synthesis atmosphere (oracle run)
